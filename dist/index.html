<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Семинар · Обратная связь</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#183a35;font:17px/1.5 system-ui,sans-serif}header{max-width:1080px;margin:auto;padding:26px;display:flex;justify-content:space-between;align-items:center}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d89b31;outline-offset:4px}.brand{font-weight:750;letter-spacing:.04em}.badge{font-size:12px;border:1px solid #cdd6cf;padding:6px 12px;border-radius:20px}main{max-width:760px;margin:40px auto 80px;padding:0 22px}h1{font-size:clamp(34px,6vw,58px);line-height:1.12;letter-spacing:-.04em;margin:20px 0}p{color:#65766d}.eyebrow{text-transform:uppercase;font-size:12px;letter-spacing:.16em;color:#567565}.card{background:#fff;border:1px solid #e0e5de;border-radius:24px;padding:30px;margin:20px 0;box-shadow:0 10px 35px #1c463308}.langs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px}.lang{padding:28px;text-align:left;border:1px solid #d6dfd5;background:#fff;border-radius:20px;color:#183a35}.lang:hover,.option:has(input:checked){background:#edf4ed;border-color:#32705d}.lang strong{font-size:24px;display:block}.lang small{color:#65766d}.primary{background:#224f42;color:white;border:0;border-radius:14px;padding:16px 26px;font-weight:600}.primary:disabled{opacity:.5;cursor:wait}.subtle{background:none;border:0;color:#426456;padding:8px}legend{font-weight:650;font-size:20px;padding:0;margin-bottom:18px}fieldset{border:0;min-width:0}label.option{display:flex;gap:12px;border:1px solid #dfe6df;border-radius:12px;padding:13px 16px;margin:9px 0;cursor:pointer}input{accent-color:#285d49;width:20px;flex-shrink:0}textarea{width:100%;resize:vertical;min-height:140px;border:1px solid #cbd8cc;border-radius:12px;padding:14px;color:#183a35}.stars{display:flex;gap:8px}.stars label{cursor:pointer;position:relative}.stars input{position:absolute;opacity:0;width:1px}.stars span{font-size:48px;color:#b9c7ba;line-height:1.3}.stars label.on span{color:#cf9b3f}.stars label:focus-within{outline:2px solid #285d49;border-radius:8px}.foot{display:flex;justify-content:space-between;gap:18px;align-items:center}.hint{font-size:13px;color:#718075}#error{color:#a42b2b}progress{width:100%;height:5px;accent-color:#39715c}.stats{display:grid;grid-template-columns:1fr 1fr;gap:15px}.stat{font-size:36px;font-weight:700}.bar{height:8px;background:#e9eee8;border-radius:10px;margin:5px 0 18px}.bar i{display:block;height:100%;background:#59836a;border-radius:10px}.wish{border-top:1px solid #e1e7df;padding:15px 0;white-space:pre-wrap;overflow-wrap:anywhere}footer{text-align:center;font-size:12px;color:#778779;padding:20px}a{color:inherit}[hidden]{display:none!important}@media(max-width:520px){main{margin-top:16px}.langs{grid-template-columns:1fr}.card{padding:22px}.foot{align-items:stretch;flex-direction:column}.stars span{font-size:43px}header{padding:20px}.badge{font-size:10px}}
</style><header><div class="brand">◈ SEMINAR</div><span class="badge">Кері байланыс · Обратная связь</span></header><main id="app"></main><footer>SEMINAR · 2026</footer><script>
const API='https://seminar-reflection-ru-kz.chatgpt-edu-5235.chatgpt.site';
const texts={ru:{tag:'Ваше мнение имеет значение',title:'Встреча закончилась.\nВпечатления остаются.',intro:'Поделитесь впечатлениями — это поможет сделать следующие семинары ещё полезнее.',start:'Выберите язык / Тілді таңдаңыз',q1:'Оцените свои впечатления от семинара по 5-балльной шкале:',q2:'Как одним словом вы бы охарактеризовали сегодняшнюю встречу?',words:['Содержательная','Практическая','Результативная','Структурированная','Конкретная'],q3:'В каком формате вы хотели бы провести следующий семинар?',formats:['Круглый стол','Мастер-класс','Открытое занятие','Тренинг','Совместное мероприятие с родителями (родители, медицинские работники, социальные работники)'],q4:'Ваши пожелания коллективу:',placeholder:'Что вам запомнилось? Что пожелаете нашей команде?',send:'Отправить отзыв',sending:'Отправляем…',anonymous:'Анонимно · около 2 минут',required:'Вопросы 1–3 обязательны. Пожелания — по желанию.',back:'← Выбрать язык',thanks:'Спасибо за обратную связь!',saved:'Ваши ответы сохранены. Они помогут нам подготовить следующую встречу.',fail:'Не удалось сохранить ответ. Проверьте соединение и попробуйте ещё раз.',progress:'Заполнено',optional:'Необязательно',done:'Ваш вклад в следующую встречу'},kz:{tag:'Сіздің пікіріңіз маңызды',title:'Кездесу аяқталды.\nӘсерлер есте қалады.',intro:'Пікіріңізбен бөлісіңіз — бұл келесі семинарларды одан әрі пайдалы етуге көмектеседі.',q1:'Семинардан алған әсеріңізді 1–5 жұлдызшамен белгілеңіз:',q2:'Бүгінгі кездесуді бір сөзбен қалай сипаттар едіңіз?',words:['Мазмұнды','Тәжірибелік','Нәтижелі','Құрылымды','Нақты'],q3:'Келесі семинардың қандай форматта өткенін қалайсыз?',formats:['Дөңгелек үстел','Шеберлік сабағы','Ашық сабақ','Тренинг','Ата-аналармен бірлескен іс-шара (ата-аналар, медицина қызметкерлері, әлеуметтік қызметкерлер)'],q4:'Ұжымға айтар тілегіңіз:',placeholder:'Есіңізде не қалды? Ұжымға қандай тілек айтасыз?',send:'Пікірді жіберу',sending:'Жіберілуде…',anonymous:'Анонимді · шамамен 2 минут',required:'1–3 сұрақтарға жауап беру міндетті. Тілек жазу — еркіңізде.',back:'← Тілді таңдау',thanks:'Кері байланысыңызға рақмет!',saved:'Жауаптарыңыз сақталды. Олар келесі кездесуді дайындауға көмектеседі.',fail:'Жауап сақталмады. Интернет байланысын тексеріп, қайталап көріңіз.',progress:'Толтырылды',optional:'Міндетті емес',done:'Келесі кездесуге қосқан үлесіңіз'}};
let lang='ru',draft={rating:0,word:null,format:null,wishes:''},id=crypto.randomUUID();const app=document.querySelector('#app');
function landing(){document.documentElement.lang='ru';app.innerHTML=`<span class="eyebrow">Рефлексия / Рефлексия</span><h1>Каждая встреча —<br>шаг вперёд.</h1><p>Әр кездесу — алға басқан қадам.</p><div class="card"><strong>Выберите язык / Тілді таңдаңыз</strong><div class="langs"><button class="lang" data-lang="ru"><strong>Русский</strong><small>Оставить отзыв ↗</small></button><button class="lang" data-lang="kz"><strong>Қазақша</strong><small>Пікір қалдыру ↗</small></button></div></div><p class="hint">Анонимно · Анонимді · ≈ 2 мин</p>`;app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;survey()})}
function survey(){const t=texts[lang];document.documentElement.lang=lang;app.innerHTML=`<button class="subtle" id="back">${t.back}</button><div class="eyebrow">${t.tag}</div><h1>${t.title.replace('\n','<br>')}</h1><p>${t.intro}</p><div class="foot hint"><span>${t.anonymous}</span><span id="count"></span></div><progress max="3" value="0"></progress><form><fieldset class="card"><legend>01 · ${t.q1}</legend><div class="stars">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="rating" value="${n}" required ${draft.rating===n?'checked':''} aria-label="${n} / 5"><span aria-hidden="true">☆</span></label>`).join('')}</div><span class="hint">1 — ${lang==='ru'?'низкая оценка':'төмен баға'} · 5 — ${lang==='ru'?'высокая оценка':'жоғары баға'}</span></fieldset>${['word','format'].map((name,j)=>`<fieldset class="card"><legend>0${j+2} · ${t['q'+(j+2)]}</legend>${t[j?'formats':'words'].map((v,i)=>`<label class="option"><input name="${name}" type="radio" value="${i}" required ${draft[name]===i?'checked':''}><span>${v}</span></label>`).join('')}</fieldset>`).join('')}<section class="card"><label for="wishes"><strong>04 · ${t.q4}</strong></label><p class="hint">${t.optional}</p><textarea id="wishes" maxlength="2000" placeholder="${t.placeholder}"></textarea><div class="hint" id="length"></div></section><p class="hint">${t.required}</p><p id="error" role="alert"></p><div class="foot"><span class="hint">${t.done}</span><button class="primary" type="submit">${t.send} ↗</button></div></form>`;const form=app.querySelector('form'),ta=app.querySelector('textarea');ta.value=draft.wishes;function update(){for(const n of ['rating','word','format']){let v=form.querySelector(`input[name="${n}"]:checked`);draft[n]=v?Number(v.value):(n==='rating'?0:null)}draft.wishes=ta.value;const n=Number(!!draft.rating)+Number(draft.word!==null)+Number(draft.format!==null);app.querySelector('progress').value=n;app.querySelector('#count').textContent=t.progress+': '+n+'/3';app.querySelector('#length').textContent=ta.value.length+'/2000';app.querySelectorAll('.stars label').forEach((l,i)=>{l.classList.toggle('on',i<draft.rating);l.querySelector('span').textContent=i<draft.rating?'★':'☆'})}form.oninput=update;update();app.querySelector('#back').onclick=landing;form.onsubmit=async e=>{e.preventDefault();update();const b=form.querySelector('button');b.disabled=true;b.textContent=t.sending;app.querySelector('#error').textContent='';try{const r=await fetch(API+'/api/responses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...draft,lang,id})});if(!r.ok)throw Error();const result=await r.json();if(!result.ok)throw Error();app.innerHTML=`<div class="card" style="text-align:center;padding:60px 25px"><span style="font-size:64px">✓</span><h1 style="font-size:40px">${t.thanks}</h1><p>${t.saved}</p></div>`;window.scrollTo(0,0)}catch{app.querySelector('#error').textContent=t.fail;b.disabled=false;b.textContent=t.send}}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function admin(){app.innerHTML='<h1>Итоги семинара</h1><p>Закрытая сводка для организатора</p><form class="card"><label>Пароль организатора<input id="password" type="password" required style="display:block;width:100%;padding:12px;margin:16px 0" autocomplete="current-password"></label><button class="primary">Открыть сводку</button><p role="alert" id="error"></p></form>';app.querySelector('form').onsubmit=async e=>{e.preventDefault();const token=app.querySelector('#password').value;try{let r=await fetch(API+'/api/results',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(r.status===401?'Неверный пароль':'Не удалось загрузить сводку');let {rows}=await r.json();showResults(rows,token)}catch(err){app.querySelector('#error').textContent=err.message}}}
function showResults(rows,token){const total=rows.length,avg=total?(rows.reduce((s,r)=>s+r.rating,0)/total).toFixed(2):'—';function chart(labels,key){return labels.map((label,i)=>{let n=rows.filter(r=>r[key]===i).length;return `<div>${esc(label)} <b> ${n}</b> <span class="hint">(${total?Math.round(n/total*100):0}%)</span><div class="bar"><i style="width:${total?n/total*100:0}%"></i></div></div>`}).join('')}app.innerHTML=`<div class="eyebrow">Для организатора</div><h1>Общая сводка</h1><div class="stats"><div class="card"><div class="stat">${total}</div>ответов</div><div class="card"><div class="stat">${avg}</div>средняя оценка / 5</div></div><div class="foot"><button id="refresh" class="primary">Обновить</button><button id="csv" class="subtle">Скачать CSV ↓</button><button id="logout" class="subtle">Выйти</button></div><section class="card"><h2>Оценки</h2>${chart(['1 ★','2 ★','3 ★','4 ★','5 ★'],'ratingIndex')}</section><section class="card"><h2>Встреча одним словом</h2>${chart(texts.ru.words,'word')}</section><section class="card"><h2>Следующий формат</h2>${chart(texts.ru.formats,'format')}</section><section class="card"><h2>Пожелания</h2>${rows.filter(r=>r.wishes).map(r=>`<div class="wish"><small class="hint">${esc(new Date(r.created_at).toLocaleString('ru-RU'))} · ${esc(r.lang)}</small><br>${esc(r.wishes)}</div>`).join('')||'<p>Пока нет пожеланий</p>'}</section><p id="error" role="alert"></p>`;app.querySelector('#logout').onclick=admin;app.querySelector('#refresh').onclick=async()=>{try{let r=await fetch(API+'/api/results',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error();showResults((await r.json()).rows,token)}catch{app.querySelector('#error').textContent='Не удалось обновить данные'}};app.querySelector('#csv').onclick=()=>{const lines=[['Дата UTC','Язык','Оценка','Характеристика','Формат','Пожелания'],...rows.map(r=>[r.created_at,r.lang,r.rating,texts.ru.words[r.word],texts.ru.formats[r.format],r.wishes])];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"').join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='seminar-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
if(location.hash==='#admin')admin();else landing();window.onhashchange=()=>location.hash==='#admin'?admin():landing();
</script></html>
